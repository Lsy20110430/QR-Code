<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>商户收款码列表</title>
<meta name="description" content="商户收款码列表，可查看各商户的微信、支付宝收款码。">
<script>
(function () {
  var KEY = 'merchant-qr-theme';
  var mode = 'auto';
  try { mode = localStorage.getItem(KEY) || 'auto'; } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') mode = 'auto';
  var dark = mode === 'dark' ||
    (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  var root = document.documentElement;
  root.setAttribute('data-theme-mode', mode);
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    color-scheme: light;
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-alt: #f9fafb;
    --border: #e4e8ee;
    --border-strong: #d3dae3;
    --text: #1b2027;
    --text-2: #5c6775;
    --text-3: #8a94a2;
    --btn-bg: #242c36;
    --btn-text: #ffffff;
    --btn-hover: #333d49;
    --hover: #f1f4f8;
    --wechat: #0a9e58;
    --wechat-bg: #e7f6ee;
    --alipay: #1677ff;
    --alipay-bg: #e8f1ff;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1116;
    --surface: #161b22;
    --surface-alt: #1b222b;
    --border: #252d38;
    --border-strong: #333d4a;
    --text: #e7ebf0;
    --text-2: #a2adbb;
    --text-3: #7d8898;
    --btn-bg: #e7ebf0;
    --btn-text: #131820;
    --btn-hover: #ffffff;
    --hover: #1d242e;
    --wechat: #3ddc84;
    --wechat-bg: rgba(61, 220, 132, .12);
    --alipay: #4d9bff;
    --alipay-bg: rgba(77, 155, 255, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color .18s ease, color .18s ease;
  }

  .page {
    flex: 1;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 16px 24px;
    display: flex;
    flex-direction: column;
  }

  .site-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .01em;
  }

  .sub {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--text-3);
  }

  .theme-toggle {
    flex: none;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }

  .theme-toggle:hover { background: var(--hover); color: var(--text); }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--alipay);
    outline-offset: 2px;
  }

  .theme-toggle svg { width: 18px; height: 18px; display: none; }

  [data-theme-mode="auto"] .theme-toggle .i-auto,
  [data-theme-mode="light"] .theme-toggle .i-light,
  [data-theme-mode="dark"] .theme-toggle .i-dark { display: block; }

  main { flex: 1; }

  .merchant-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .merchant-item {
    display: flex;
    align-items: stretch;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    transition: background-color .15s ease, border-color .15s ease;
  }

  .merchant-item:hover { border-color: var(--border-strong); }

  .merchant {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 10px 14px 16px;
    color: inherit;
    text-decoration: none;
  }

  .merchant:focus-visible {
    outline: 2px solid var(--alipay);
    outline-offset: -2px;
    border-radius: 12px 0 0 12px;
  }

  .share-btn {
    flex: none;
    width: 58px;
    padding: 0;
    border: 0;
    border-left: 1px solid var(--border);
    border-radius: 0 12px 12px 0;
    background: transparent;
    color: var(--text-3);
    font-family: inherit;
    font-size: 11px;
    line-height: 1.2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
  }

  .share-btn:hover { background: var(--hover); color: var(--text); }

  .share-btn:focus-visible {
    outline: 2px solid var(--alipay);
    outline-offset: -2px;
  }

  .share-btn svg { width: 17px; height: 17px; }

  .share-btn .i-check { display: none; }

  .share-btn.copied { color: var(--wechat); }
  .share-btn.copied .i-link { display: none; }
  .share-btn.copied .i-check { display: block; }

  .merchant-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .merchant-name {
    font-size: 16px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .merchant-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 13px;
    color: var(--text-3);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.6;
  }

  .tag::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .tag.wechat { color: var(--wechat); background: var(--wechat-bg); }
  .tag.alipay { color: var(--alipay); background: var(--alipay-bg); }
  .tag.other { color: var(--text-2); background: var(--hover); }

  .chevron {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--text-3);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    z-index: 20;
    max-width: calc(100% - 32px);
    padding: 10px 16px;
    border-radius: 999px;
    background: #1c232c;
    border: 1px solid rgba(255, 255, 255, .12);
    color: #ffffff;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 8px);
    transition: opacity .2s ease, transform .2s ease;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(10, 14, 20, .5);
  }

  .modal[hidden] { display: none; }

  .modal-card {
    width: 100%;
    max-width: 360px;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .24);
  }

  .modal-card h3 {
    margin: 0 0 6px;
    font-size: 16px;
    font-weight: 600;
  }

  .modal-card p {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--text-3);
  }

  .link-input {
    display: block;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-alt);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-all;
    resize: none;
  }

  .link-input:focus { outline: 2px solid var(--alipay); outline-offset: -1px; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 14px;
  }

  .modal-btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  .modal-btn.primary {
    border-color: transparent;
    background: var(--btn-bg);
    color: var(--btn-text);
  }

  .state {
    padding: 40px 16px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    text-align: center;
    font-size: 14px;
    color: var(--text-3);
    word-break: break-word;
  }

  .site-footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
  }

  .site-footer p {
    margin: 0;
    font-size: 13px;
    color: var(--text-3);
  }

  .site-footer .contact { margin-bottom: 4px; color: var(--text-2); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="site-header">
    <div>
      <h1>商户收款码列表</h1>
      <p class="sub" id="summary">正在加载…</p>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换显示模式">
      <svg class="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="12" rx="2"></rect>
        <path d="M8.5 20h7M12 16v4"></path>
      </svg>
      <svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path>
      </svg>
    </button>
  </header>

  <main>
    <ul class="merchant-list" id="merchantList"></ul>
    <div class="state" id="stateBox" hidden></div>
  </main>

  <footer class="site-footer">
    <p class="contact">联系方式：QQ: 3585366922</p>
    <p>存放收款码请联系管理员</p>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal" id="linkModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="linkTitle">
    <h3 id="linkTitle">分享链接</h3>
    <p>复制下面的链接发给客户，打开即可直接看到该商户的收款码。</p>
    <textarea class="link-input" id="linkInput" rows="3" readonly></textarea>
    <div class="modal-actions">
      <button class="modal-btn" type="button" id="linkClose">关闭</button>
      <button class="modal-btn primary" type="button" id="linkCopy">复制链接</button>
    </div>
  </div>
</div>

<script>
(function () {
  var KEY = 'merchant-qr-theme';
  var root = document.documentElement;
  var mql = window.matchMedia('(prefers-color-scheme: dark)');
  var toggle = document.getElementById('themeToggle');
  var LABELS = { auto: '跟随系统', light: '白天模式', dark: '黑夜模式' };

  function currentMode() {
    var m = root.getAttribute('data-theme-mode');
    return (m === 'light' || m === 'dark') ? m : 'auto';
  }

  function syncTheme() {
    var mode = currentMode();
    var dark = mode === 'dark' || (mode === 'auto' && mql.matches);
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    toggle.title = '显示模式：' + LABELS[mode] + '（点击切换）';
    toggle.setAttribute('aria-label', '显示模式：' + LABELS[mode] + '，点击切换');
  }

  toggle.addEventListener('click', function () {
    var order = ['auto', 'light', 'dark'];
    var next = order[(order.indexOf(currentMode()) + 1) % order.length];
    root.setAttribute('data-theme-mode', next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
    syncTheme();
  });

  var onSystemChange = function () {
    if (currentMode() === 'auto') syncTheme();
  };
  if (mql.addEventListener) mql.addEventListener('change', onSystemChange);
  else if (mql.addListener) mql.addListener(onSystemChange);

  syncTheme();

  var listEl = document.getElementById('merchantList');
  var stateEl = document.getElementById('stateBox');
  var summaryEl = document.getElementById('summary');

  function setState(text) {
    stateEl.textContent = text || '';
    stateEl.hidden = !text;
    listEl.hidden = !!text;
  }

  function parseTime(value) {
    if (!value) return 0;
    var t = Date.parse(String(value).replace(/-/g, '/').replace('T', ' '));
    return isNaN(t) ? 0 : t;
  }

  function formatTime(value) {
    if (!value) return '未知时间';
    var s = String(value).trim().replace('T', ' ');
    return /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(s) ? s.slice(0, 16) : s;
  }

  function platformClass(platform) {
    if (platform === '微信') return 'wechat';
    if (platform === '支付宝') return 'alipay';
    return 'other';
  }

  var CHEVRON = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M9 6l6 6-6 6"></path></svg>';

  var SHARE_ICONS = '<svg class="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M10.5 13.5a4.5 4.5 0 0 0 6.4 0l2.3-2.3a4.5 4.5 0 0 0-6.4-6.4l-1.3 1.3"></path>' +
    '<path d="M13.5 10.5a4.5 4.5 0 0 0-6.4 0l-2.3 2.3a4.5 4.5 0 0 0 6.4 6.4l1.3-1.3"></path></svg>' +
    '<svg class="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';

  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(text) {
    if (!toastEl) return;
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3000);
  }

  var modalEl = document.getElementById('linkModal');
  var linkInput = document.getElementById('linkInput');

  function showLink(url) {
    linkInput.value = url;
    modalEl.hidden = false;
    document.body.style.overflow = 'hidden';
    setTimeout(function () {
      linkInput.focus();
      linkInput.setSelectionRange(0, url.length);
      linkInput.scrollTop = 0;
    }, 30);
  }

  function hideLink() {
    modalEl.hidden = true;
    document.body.style.overflow = '';
  }

  document.getElementById('linkClose').addEventListener('click', hideLink);

  document.getElementById('linkCopy').addEventListener('click', function () {
    copyText(linkInput.value).then(function () {
      hideLink();
      toast('链接已复制');
    }).catch(function () {
      linkInput.focus();
      linkInput.setSelectionRange(0, linkInput.value.length);
      toast('复制失败，请长按输入框手动复制');
    });
  });

  modalEl.addEventListener('click', function (event) {
    if (event.target === modalEl) hideLink();
  });

  function isLoopback() {
    var host = window.location.hostname;
    return host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || host === '::1';
  }

  function shareUrl(merchant) {
    var url = new URL('show.html', window.location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('id', merchant.id || merchant.name);
    return url.href;
  }

  // 没 https 时 navigator.clipboard 不可用（局域网访问就是这种情况），退回 execCommand
  function copyText(text) {
    if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      area.remove();
      ok ? resolve() : reject(new Error('复制失败'));
    });
  }

  function markCopied(button) {
    var label = button.querySelector('.share-label');
    button.classList.add('copied');
    label.textContent = '已复制';
    clearTimeout(button.copyTimer);
    button.copyTimer = setTimeout(function () {
      button.classList.remove('copied');
      label.textContent = '分享';
    }, 1800);
  }

  function buildItem(merchant) {
    var li = document.createElement('li');
    li.className = 'merchant-item';

    var link = document.createElement('a');
    link.className = 'merchant';
    link.href = 'show.html?id=' + encodeURIComponent(merchant.id || merchant.name);

    var main = document.createElement('span');
    main.className = 'merchant-main';

    var name = document.createElement('span');
    name.className = 'merchant-name';
    name.textContent = merchant.name;

    var meta = document.createElement('span');
    meta.className = 'merchant-meta';

    var tag = document.createElement('span');
    tag.className = 'tag ' + platformClass(merchant.platform);
    tag.textContent = merchant.platform || '未标注';

    var time = document.createElement('span');
    time.textContent = '创建于 ' + formatTime(merchant.createdAt);

    meta.appendChild(tag);
    meta.appendChild(time);
    main.appendChild(name);
    main.appendChild(meta);
    link.appendChild(main);
    link.insertAdjacentHTML('beforeend', CHEVRON);

    var share = document.createElement('button');
    share.type = 'button';
    share.className = 'share-btn';
    share.setAttribute('aria-label', '复制「' + merchant.name + '」的分享链接');
    share.innerHTML = SHARE_ICONS + '<span class="share-label">分享</span>';
    share.addEventListener('click', function () {
      var url = shareUrl(merchant);
      copyText(url).then(function () {
        markCopied(share);
        if (isLoopback()) {
          toast('已复制。当前是本机地址，别人打不开，请改用域名或局域网 IP 访问后再分享');
        }
      }).catch(function () {
        showLink(url);
      });
    });

    li.appendChild(link);
    li.appendChild(share);
    return li;
  }

  fetch('data.json', { cache: 'no-store' })
    .then(function (response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    })
    .then(function (data) {
      var items = data && Array.isArray(data.merchants) ? data.merchants.slice() : [];
      items = items.filter(function (m) { return m && m.name; });
      items.sort(function (a, b) { return parseTime(b.createdAt) - parseTime(a.createdAt); });

      if (!items.length) {
        summaryEl.textContent = '暂无商户';
        setState('暂无商户收款码');
        return;
      }

      summaryEl.textContent = '共 ' + items.length + ' 个商户';
      setState('');
      for (var i = 0; i < items.length; i++) {
        listEl.appendChild(buildItem(items[i]));
      }
    })
    .catch(function (err) {
      summaryEl.textContent = '数据未加载';
      setState('商户数据加载失败（' + err.message + '）。请确认 data.json 可访问，' +
        '并通过 http(s) 打开本页，而不是直接双击本地文件。');
    });
})();
</script>
</body>
</html>
