<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>商户收款码</title>
<meta name="description" content="商户收款码展示，可下载收款码图片。">
<script>
(function () {
  var KEY = 'merchant-qr-theme';
  var mode = 'auto';
  try { mode = localStorage.getItem(KEY) || 'auto'; } catch (e) {}
  if (mode !== 'light' && mode !== 'dark') mode = 'auto';
  var dark = mode === 'dark' ||
    (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  var root = document.documentElement;
  root.setAttribute('data-theme-mode', mode);
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    color-scheme: light;
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-alt: #f9fafb;
    --border: #e4e8ee;
    --border-strong: #d3dae3;
    --text: #1b2027;
    --text-2: #5c6775;
    --text-3: #8a94a2;
    --btn-bg: #242c36;
    --btn-text: #ffffff;
    --btn-hover: #333d49;
    --hover: #f1f4f8;
    --wechat: #0a9e58;
    --wechat-bg: #e7f6ee;
    --alipay: #1677ff;
    --alipay-bg: #e8f1ff;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1116;
    --surface: #161b22;
    --surface-alt: #1b222b;
    --border: #252d38;
    --border-strong: #333d4a;
    --text: #e7ebf0;
    --text-2: #a2adbb;
    --text-3: #7d8898;
    --btn-bg: #e7ebf0;
    --btn-text: #131820;
    --btn-hover: #ffffff;
    --hover: #1d242e;
    --wechat: #3ddc84;
    --wechat-bg: rgba(61, 220, 132, .12);
    --alipay: #4d9bff;
    --alipay-bg: rgba(77, 155, 255, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color .18s ease, color .18s ease;
  }

  .page {
    flex: 1;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 16px 24px;
    display: flex;
    flex-direction: column;
  }

  .site-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .01em;
  }

  .theme-toggle {
    flex: none;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }

  .theme-toggle:hover { background: var(--hover); color: var(--text); }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--alipay);
    outline-offset: 2px;
  }

  .theme-toggle svg { width: 18px; height: 18px; display: none; }

  [data-theme-mode="auto"] .theme-toggle .i-auto,
  [data-theme-mode="light"] .theme-toggle .i-light,
  [data-theme-mode="dark"] .theme-toggle .i-dark { display: block; }

  main { flex: 1; }

  .qr-card {
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  .qr-head {
    margin-bottom: 16px;
    text-align: center;
  }

  .qr-head h2 {
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 600;
    word-break: break-word;
  }

  .qr-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 13px;
    color: var(--text-3);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.6;
  }

  .tag::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .tag.wechat { color: var(--wechat); background: var(--wechat-bg); }
  .tag.alipay { color: var(--alipay); background: var(--alipay-bg); }
  .tag.other { color: var(--text-2); background: var(--hover); }

  .qr-box {
    display: flex;
    justify-content: center;
    padding: 14px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .qr-box img {
    display: block;
    width: 100%;
    max-width: 320px;
    height: auto;
  }

  .btn {
    margin-top: 18px;
    width: 100%;
    padding: 12px 16px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: var(--btn-bg);
    color: var(--btn-text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: background-color .15s ease, opacity .15s ease;
  }

  .btn:hover { background: var(--btn-hover); }

  .btn:focus-visible {
    outline: 2px solid var(--alipay);
    outline-offset: 2px;
  }

  .btn:disabled { opacity: .55; cursor: default; }

  .btn svg { width: 16px; height: 16px; }

  .hint {
    margin: 10px 0 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
  }

  .state {
    padding: 40px 16px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    text-align: center;
    font-size: 14px;
    color: var(--text-3);
    word-break: break-word;
  }

  .site-footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
  }

  .site-footer p {
    margin: 0;
    font-size: 13px;
    color: var(--text-3);
  }

  .site-footer .contact { margin-bottom: 4px; color: var(--text-2); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="site-header">
    <h1>商户收款码</h1>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换显示模式">
      <svg class="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="12" rx="2"></rect>
        <path d="M8.5 20h7M12 16v4"></path>
      </svg>
      <svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path>
      </svg>
    </button>
  </header>

  <main>
    <section class="qr-card" id="qrCard" hidden>
      <div class="qr-head">
        <h2 id="merchantName"></h2>
        <div class="qr-meta">
          <span class="tag" id="platformTag"></span>
          <span id="createdAt"></span>
        </div>
      </div>
      <div class="qr-box">
        <img id="qrImage" alt="" decoding="async">
      </div>
      <button class="btn" id="downloadBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12M7 10l5 5 5-5M4 20h16"></path>
        </svg>
        下载收款码图片
      </button>
      <p class="hint">无法下载时，可长按图片保存到相册</p>
    </section>

    <div class="state" id="stateBox">正在加载…</div>
  </main>

  <footer class="site-footer">
    <p class="contact">联系方式：QQ: 3585366922</p>
    <p>存放收款码请联系管理员</p>
  </footer>
</div>

<script>
(function () {
  var KEY = 'merchant-qr-theme';
  var root = document.documentElement;
  var mql = window.matchMedia('(prefers-color-scheme: dark)');
  var toggle = document.getElementById('themeToggle');
  var LABELS = { auto: '跟随系统', light: '白天模式', dark: '黑夜模式' };

  function currentMode() {
    var m = root.getAttribute('data-theme-mode');
    return (m === 'light' || m === 'dark') ? m : 'auto';
  }

  function syncTheme() {
    var mode = currentMode();
    var dark = mode === 'dark' || (mode === 'auto' && mql.matches);
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    toggle.title = '显示模式：' + LABELS[mode] + '（点击切换）';
    toggle.setAttribute('aria-label', '显示模式：' + LABELS[mode] + '，点击切换');
  }

  toggle.addEventListener('click', function () {
    var order = ['auto', 'light', 'dark'];
    var next = order[(order.indexOf(currentMode()) + 1) % order.length];
    root.setAttribute('data-theme-mode', next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
    syncTheme();
  });

  var onSystemChange = function () {
    if (currentMode() === 'auto') syncTheme();
  };
  if (mql.addEventListener) mql.addEventListener('change', onSystemChange);
  else if (mql.addListener) mql.addListener(onSystemChange);

  syncTheme();

  var stateEl = document.getElementById('stateBox');
  var cardEl = document.getElementById('qrCard');
  var nameEl = document.getElementById('merchantName');
  var platformEl = document.getElementById('platformTag');
  var timeEl = document.getElementById('createdAt');
  var imgEl = document.getElementById('qrImage');
  var downloadBtn = document.getElementById('downloadBtn');
  var merchant = null;
  var imagePath = '';

  function showState(text) {
    stateEl.textContent = text;
    stateEl.hidden = false;
    cardEl.hidden = true;
  }

  function platformClass(platform) {
    if (platform === '微信') return 'wechat';
    if (platform === '支付宝') return 'alipay';
    return 'other';
  }

  function formatTime(value) {
    if (!value) return '未知时间';
    var s = String(value).trim().replace('T', ' ');
    return /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(s) ? s.slice(0, 16) : s;
  }

  function fileName() {
    var ext = /\.([a-z0-9]+)(?:[?#]|$)/i.exec(imagePath);
    var base = merchant.name + '-' + (merchant.platform || '收款') + '收款码';
    base = base.replace(/[\\/:*?"<>|\s]+/g, '_').replace(/^_+|_+$/g, '');
    return base + '.' + (ext ? ext[1].toLowerCase() : 'png');
  }

  function saveBlob(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  downloadBtn.addEventListener('click', function () {
    if (!imagePath) return;
    downloadBtn.disabled = true;
    fetch(imagePath, { cache: 'force-cache' })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.blob();
      })
      .then(saveBlob)
      .catch(function () {
        window.open(imagePath, '_blank');
      })
      .then(function () { downloadBtn.disabled = false; });
  });

  var key = new URLSearchParams(window.location.search).get('id');
  if (!key) {
    showState('未找到商户信息');
    return;
  }

  fetch('data.json', { cache: 'no-store' })
    .then(function (response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    })
    .then(function (data) {
      var items = data && Array.isArray(data.merchants) ? data.merchants : [];
      for (var i = 0; i < items.length; i++) {
        var m = items[i];
        if (m && (m.id === key || m.name === key)) {
          merchant = m;
          break;
        }
      }

      if (!merchant) {
        showState('未找到该商户收款码，可能已下架或链接有误');
        return;
      }

      imagePath = merchant.image || '';
      if (!imagePath) {
        showState('该商户尚未配置收款码图片，请联系管理员');
        return;
      }

      document.title = merchant.name + ' - 商户收款码';
      nameEl.textContent = merchant.name;
      platformEl.className = 'tag ' + platformClass(merchant.platform);
      platformEl.textContent = merchant.platform || '未标注';
      timeEl.textContent = '创建于 ' + formatTime(merchant.createdAt);
      imgEl.alt = merchant.name + ' 收款码';

      imgEl.addEventListener('load', function () {
        stateEl.hidden = true;
        cardEl.hidden = false;
      });
      imgEl.addEventListener('error', function () {
        showState('收款码图片加载失败，请联系管理员');
      });
      imgEl.src = imagePath;
    })
    .catch(function (err) {
      showState('商户数据加载失败（' + err.message + '）。请确认 data.json 可访问，' +
        '并通过 http(s) 打开本页，而不是直接双击本地文件。');
    });
})();
</script>
</body>
</html>
